events {}
http {
  server {
    listen 3000;
    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
    }
  }
  server {
    listen 3333;
    location / {
      if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
      proxy_pass http://casino:3333;
      proxy_set_header Host $host;
    }
  }
}
