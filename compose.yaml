services:
  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://api_sports:local-dev-only@postgres:5432/api_sports
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - '127.0.0.1:53000:3000'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_sports
      POSTGRES_USER: api_sports
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - sports-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U api_sports -d api_sports']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sports-postgres:
